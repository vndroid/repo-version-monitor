[database]
path = "versions.sqlite3"

[github]
# Optional. You can also set GITHUB_TOKEN in the environment.
token = "GITHUB_TOKEN"
per_page = 10

[gitlab]
# Settings for gitlab.com. Self-managed instances are configured per product,
# with external_url (and an optional token) in their [[products]] block.
# Optional. You can also set GITLAB_TOKEN in the environment.
token = ""

[mailgun]
# Official reference: https://documentation.mailgun.com/docs/mailgun/api-reference/send/mailgun
# Set false to disable email notifications entirely.
# When disabled, no other mailgun settings (including the API key) are required.
enabled = true
# Required values. api_key should normally come from MAILGUN_API_KEY.
domain = "mg.example.com"
api_key = "MAILGUN_API_KEY"
from_email = "Version Monitor <monitor@mg.example.com>"
to_emails = ["you@example.com"]
# Mailgun API endpoint. For EU accounts, use "https://api.eu.mailgun.net/v3".
api_url = "https://api.mailgun.net/v3"

[smtp]
# Delivery through a plain SMTP server, as an alternative to Mailgun: enable
# either one, not both. password should normally come from SMTP_PASSWORD.
enabled = false
host = ""
port = 587
# "starttls" (usually 587), "ssl" (usually 465) or "none" (internal relay only).
encryption = "starttls"
# Leave username empty for a relay that needs no authentication.
username = ""
password = ""
from_email = ""
to_emails = []

[monitor]
interval_seconds = 3600
notify_on_first_seen = false

[proxy]
# Proxy for every outgoing HTTP request (GitHub, GitLab, Mailgun); SMTP does
# not go through it. When disabled, the HTTP_PROXY/HTTPS_PROXY environment
# variables still apply as usual.
enabled = false
# "http" or "socks5".
type = "http"
host = ""
port = 8080
# Optional proxy credentials.
username = ""
password = ""

# An empty provider means "github"; set it to "gitlab" for GitLab projects.
# GitLab paths may include subgroups: group/subgroup/project.
# external_url and token are only for self-managed GitLab instances (see the
# last entry): leave them empty for github.com and gitlab.com projects.
# suffix tracks tags carrying it, e.g. "-ee" for gitlab-org/gitlab; empty means
# plain version tags such as v1.2.3. Several alternatives are separated by "|",
# most preferred first: "-ee|-ce".
# prefix does the same at the other end, e.g. "release-" for release-1.1.1:
# only tags carrying it are considered, and the version is compared without it.
[[products]]
name = "httpx"
provider = ""
external_url = ""
token = ""
repository = "encode/httpx"
branch = ""
prefix = ""
suffix = ""

[[products]]
name = "FastAPI"
provider = ""
external_url = ""
token = ""
repository = "fastapi/fastapi"
branch = ""
prefix = ""
suffix = ""

[[products]]
name = "gitlab-runner"
provider = "gitlab"
external_url = ""
token = ""
repository = "gitlab-org/gitlab-runner"
branch = ""
prefix = ""
suffix = ""

[[products]]
name = "gitlab"
provider = "gitlab"
external_url = ""
token = ""
repository = "gitlab-org/gitlab"
branch = ""
prefix = ""
suffix = "-ee"

[[products]]
name = "example"
provider = "gitlab"
external_url = "https://jihulab.com"
token = ""
repository = "example/project"
branch = ""
prefix = ""
suffix = ""
