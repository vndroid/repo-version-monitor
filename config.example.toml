[database]
path = "versions.sqlite3"

[github]
# Optional. You can also set GITHUB_TOKEN in the environment.
token = "GITHUB_TOKEN"
per_page = 10

[gitlab]
# Optional. You can also set GITLAB_TOKEN in the environment.
# Only needed for private projects or self-hosted instances with restrictions.
# token = "GITLAB_TOKEN"
# For self-managed GitLab, point external_url at your instance.
external_url = "https://gitlab.com"

[mailgun]
# Set false to disable email notifications entirely.
# When disabled, no other mailgun settings (including the API key) are required.
enabled = true
# Required values. api_key should normally come from MAILGUN_API_KEY.
domain = "mg.example.com"
api_key = "MAILGUN_API_KEY"
from_email = "Version Monitor <monitor@mg.example.com>"
to_emails = ["you@example.com"]
# For EU Mailgun accounts, use "https://api.eu.mailgun.net/v3".
base_url = "https://api.mailgun.net/v3"

[monitor]
interval_seconds = 3600
notify_on_first_seen = false

[[products]]
name = "httpx"
repository = "encode/httpx"
branch = ""

[[products]]
name = "FastAPI"
repository = "fastapi/fastapi"
branch = ""

# provider defaults to "github" when omitted; set it to "gitlab" for GitLab
# projects. GitLab paths may include subgroups: group/subgroup/project.
[[products]]
name = "gitlab-runner"
provider = "gitlab"
repository = "gitlab-org/gitlab-runner"
branch = ""

