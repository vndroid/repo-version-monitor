[project]
name = "repo-version-monitor"
version = "0.1.0"
description = "Monitor GitHub repository tags and send Mailgun email notifications."
readme = "README.md"
requires-python = "==3.13.13"
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
repo-version-monitor = "repo_version_monitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
